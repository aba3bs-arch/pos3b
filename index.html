<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ABARROTES LAS 3B — POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3b66b5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POS 3B" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <script src="/pos3b-config.js"></script>
    <script>
      /* Tras un deploy, chunks viejos fallan: recargar una vez para tomar el index nuevo. */
      (function () {
        var KEY = 'pos3b_chunk_reload';
        function debeRecargar(msg) {
          return /Failed to fetch dynamically imported module|error loading dynamically imported module|Loading chunk|Loading CSS chunk|Unable to preload CSS/i.test(
            String(msg || ''),
          );
        }
        function recargarUnaVez() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            /* ignore */
          }
          window.location.reload();
        }
        window.addEventListener('vite:preloadError', function (event) {
          try {
            event.preventDefault();
          } catch (e) {
            /* ignore */
          }
          recargarUnaVez();
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || reason || '';
          if (debeRecargar(msg)) recargarUnaVez();
        });
        window.addEventListener(
          'error',
          function (event) {
            var t = event && event.target;
            if (t && t.tagName === 'SCRIPT' && t.src && /\/assets\//.test(t.src)) {
              recargarUnaVez();
            }
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
