<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>ABARROTES LAS 3B — POS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
    <link rel="icon" href="/logo-3b.png" type="image/png" sizes="any" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#3b66b5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POS 3B" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script src="/pos3b-config.js"></script>
    <script>
      /* Tras un deploy, chunks viejos fallan: recargar una vez para tomar el index nuevo. */
      (function () {
        var KEY = 'pos3b_chunk_reload';
        function debeRecargar(msg) {
          return /Failed to fetch dynamically imported module|error loading dynamically imported module|Loading chunk|Loading CSS chunk|Unable to preload CSS/i.test(
            String(msg || ''),
          );
        }
        function recargarUnaVez() {
          try {
            var ultimo = Number(sessionStorage.getItem(KEY) || 0);
            if (ultimo && Date.now() - ultimo < 60000) return;
            sessionStorage.setItem(KEY, String(Date.now()));
          } catch (e) {
            /* ignore */
          }
          window.location.reload();
        }
        window.addEventListener('vite:preloadError', function (event) {
          try {
            event.preventDefault();
          } catch (e) {
            /* ignore */
          }
          recargarUnaVez();
        });
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || reason || '';
          if (debeRecargar(msg)) recargarUnaVez();
        });
        window.addEventListener(
          'error',
          function (event) {
            var t = event && event.target;
            if (t && t.tagName === 'SCRIPT' && t.src && /\/assets\//.test(t.src)) {
              recargarUnaVez();
            }
          },
          true,
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      /* Si tras 8 s no pintó nada (JS que no cargó / navegador viejo / caché dañado), ofrecer recargar. */
      (function () {
        function raizVacia() {
          var r = document.getElementById('root');
          return !r || r.childElementCount === 0;
        }
        function quitar() {
          var f = document.getElementById('pos3b-pantalla-blanca');
          if (f && f.parentNode) f.parentNode.removeChild(f);
        }
        function mostrar() {
          if (document.getElementById('pos3b-pantalla-blanca')) return;
          var d = document.createElement('div');
          d.id = 'pos3b-pantalla-blanca';
          d.style.cssText =
            'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:1rem;background:#fff;color:#111;font-family:system-ui,sans-serif;z-index:99999;text-align:center';
          d.innerHTML =
            '<div style="max-width:420px"><h2 style="margin:0 0 .5rem">POS 3B no terminó de cargar</h2>' +
            '<p style="margin:0 0 1rem;color:#555">Revisa el internet y pulsa el botón. Tu tienda y este equipo no se pierden.</p>' +
            '<button id="pos3b-pb-recargar" style="padding:.7rem 1.2rem;font-size:1rem;border:0;border-radius:8px;background:#3b66b5;color:#fff">Limpiar y recargar</button></div>';
          document.body.appendChild(d);
          document.getElementById('pos3b-pb-recargar').onclick = function () {
            var hecho = function () {
              var u = new URL(window.location.href);
              u.searchParams.set('_r', String(Date.now()));
              window.location.replace(u.toString());
            };
            try {
              if (window.caches && caches.keys) {
                caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).then(hecho, hecho);
                return;
              }
            } catch (e) { /* ignore */ }
            hecho();
          };
        }
        setTimeout(function () {
          if (raizVacia()) mostrar();
          setInterval(function () { if (!raizVacia()) quitar(); }, 2000);
        }, 8000);
      })();
    </script>
  </body>
</html>
