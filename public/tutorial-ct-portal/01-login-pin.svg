<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">1 · Entra con tu PIN móvil</text>
  <text x="48" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#546e7a">Solo en tu celular · no uses este PIN en la caja</text>
  <!-- phone -->
  <g filter="url(#shadow)">
    <rect x="90" y="120" width="220" height="320" rx="28" fill="#1a237e"/>
    <rect x="102" y="148" width="196" height="268" rx="12" fill="#fff"/>
    <circle cx="200" cy="134" r="5" fill="#90a4ae"/>
    <text x="200" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#0d47a1">POS 3B · CT</text>
    <text x="200" y="215" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#607d8b">PIN móvil</text>
    <rect x="130" y="235" width="140" height="44" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="200" y="263" text-anchor="middle" font-family="ui-monospace,monospace" font-size="22" font-weight="700" fill="#0d47a1" letter-spacing="4">••••</text>
    <rect x="130" y="300" width="140" height="42" rx="10" fill="url(#brand)"/>
    <text x="200" y="327" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Entrar</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="380" y="150" width="500" height="70" rx="14" fill="#fff" filter="url(#shadow)"/>
    <text x="410" y="180" font-size="16" font-weight="700" fill="#2e7d32">✓ PIN que te dio RH / Admin</text>
    <text x="410" y="205" font-size="14" fill="#546e7a">Queda anclado a este teléfono</text>
    <rect x="380" y="240" width="500" height="70" rx="14" fill="#fff" filter="url(#shadow)"/>
    <text x="410" y="270" font-size="16" font-weight="700" fill="#c62828">✗ No es el PIN de la caja</text>
    <text x="410" y="295" font-size="14" fill="#546e7a">La caja usa el PIN temporal al aceptar</text>
    <rect x="380" y="330" width="500" height="70" rx="14" fill="#fff" filter="url(#shadow)"/>
    <text x="410" y="360" font-size="16" font-weight="700" fill="#1565c0">→ Llegas a Mis solicitudes CT</text>
    <text x="410" y="385" font-size="14" fill="#546e7a">Checador · solo tus coberturas</text>
  </g>

</svg>
