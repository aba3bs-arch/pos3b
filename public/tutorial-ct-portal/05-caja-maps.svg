<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">5 · Llega a la tienda y marca en caja</text>
  <text x="48" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#546e7a">Maps te lleva · en caja usa el PIN temporal</text>
  <!-- map card -->
  <g filter="url(#shadow)">
    <rect x="60" y="130" width="400" height="260" rx="16" fill="#fff"/>
    <rect x="80" y="155" width="360" height="160" rx="12" fill="#e3f2fd"/>
    <circle cx="260" cy="230" r="14" fill="#c62828"/>
    <circle cx="260" cy="230" r="6" fill="#fff"/>
    <text x="260" y="345" text-anchor="middle" font-size="15" font-weight="700" fill="#0d47a1" font-family="Segoe UI,Arial,sans-serif">3B2 Pueblo Nuevo</text>
    <text x="260" y="368" text-anchor="middle" font-size="13" fill="#1565c0" font-family="Segoe UI,Arial,sans-serif">Abrir en Google Maps →</text>
  </g>
  <!-- pos login -->
  <g filter="url(#shadow)">
    <rect x="520" y="130" width="380" height="260" rx="16" fill="#fff"/>
    <text x="710" y="175" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1" font-family="Segoe UI,Arial,sans-serif">Caja POS · login</text>
    <rect x="580" y="200" width="260" height="48" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="710" y="230" text-anchor="middle" font-size="22" font-weight="800" fill="#2e7d32" font-family="ui-monospace,monospace">4821</text>
    <text x="710" y="280" text-anchor="middle" font-size="13" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">PIN temporal del día</text>
    <rect x="600" y="310" width="220" height="42" rx="10" fill="url(#brand)"/>
    <text x="710" y="337" text-anchor="middle" fill="#fff" font-size="15" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Entrar a caja</text>
  </g>

</svg>
