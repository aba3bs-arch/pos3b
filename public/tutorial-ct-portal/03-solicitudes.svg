<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">3 · Solicitudes para ti</text>
  <text x="48" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#546e7a">Fecha · tienda con colonia · Maps · Aceptar / Rechazar</text>
  <g filter="url(#shadow)">
    <rect x="48" y="120" width="864" height="300" rx="16" fill="#fff"/>
    <rect x="48" y="120" width="864" height="48" fill="#e8f5e9" rx="16"/>
    <rect x="48" y="150" width="864" height="18" fill="#e8f5e9"/>
    <text x="72" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#1b5e20">Solicitudes para ti</text>
    <!-- header -->
    <text x="72" y="200" font-size="12" fill="#78909c" font-family="Segoe UI,Arial,sans-serif" font-weight="700">FECHA</text>
    <text x="220" y="200" font-size="12" fill="#78909c" font-family="Segoe UI,Arial,sans-serif" font-weight="700">TIENDA</text>
    <text x="480" y="200" font-size="12" fill="#78909c" font-family="Segoe UI,Arial,sans-serif" font-weight="700">ESTADO</text>
    <text x="620" y="200" font-size="12" fill="#78909c" font-family="Segoe UI,Arial,sans-serif" font-weight="700">ACCIÓN</text>
    <!-- row -->
    <text x="72" y="245" font-size="15" fill="#263238" font-family="Segoe UI,Arial,sans-serif">sáb 14 sep</text>
    <text x="220" y="245" font-size="15" font-weight="700" fill="#0d47a1" font-family="Segoe UI,Arial,sans-serif">3B2 Pueblo Nuevo</text>
    <text x="220" y="268" font-size="13" fill="#1565c0" font-family="Segoe UI,Arial,sans-serif">📍 Maps</text>
    <rect x="480" y="228" width="90" height="28" rx="8" fill="#fff8e1"/>
    <text x="525" y="247" text-anchor="middle" font-size="12" font-weight="700" fill="#f9a825" font-family="Segoe UI,Arial,sans-serif">Pendiente</text>
    <rect x="620" y="225" width="88" height="32" rx="8" fill="#2e7d32"/>
    <text x="664" y="246" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Aceptar</text>
    <rect x="720" y="225" width="88" height="32" rx="8" fill="#fff" stroke="#b0bec5"/>
    <text x="764" y="246" text-anchor="middle" fill="#546e7a" font-size="13" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Rechazar</text>
    <text x="72" y="330" font-size="14" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">Ejemplo: 3B5 Lomas Dos · 3B6 Solidaridad · 3B7 Del Valle · 3B9 Buenos Aires · 3B10 El Mezquite</text>
    <text x="72" y="365" font-size="14" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">Pulsa Maps para abrir Google Maps con la ubicación de la tienda.</text>
  </g>

</svg>
