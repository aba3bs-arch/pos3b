<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">6 · Tu % de aceptación</text>
  <text x="48" y="86" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#546e7a">Empiezas en 100% · bajo 60% se bloquea la app</text>
  <g filter="url(#shadow)">
    <rect x="120" y="140" width="720" height="200" rx="18" fill="#fff"/>
    <text x="160" y="190" font-size="16" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">Aceptación</text>
    <text x="160" y="245" font-size="48" font-weight="800" fill="#2e7d32" font-family="Segoe UI,Arial,sans-serif">100%</text>
    <rect x="360" y="200" width="420" height="28" rx="14" fill="#e8f5e9"/>
    <rect x="360" y="200" width="420" height="28" rx="14" fill="#2e7d32"/>
    <text x="360" y="270" font-size="14" fill="#455a64" font-family="Segoe UI,Arial,sans-serif">La tienda te evalúa: puntualidad, faltantes, quejas…</text>
    <text x="360" y="298" font-size="14" font-weight="700" fill="#c62828" font-family="Segoe UI,Arial,sans-serif">Si bajas de 60%, Admin desbloquea en RH</text>
  </g>

</svg>
