<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fa"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">7 · Carga de camión (Venta en Ruta)</text>
  <text x="48" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Al cargar, el stock sale de CEDIS hacia el camión</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="864" height="320" rx="16" fill="#fff"/>
    <!-- nav -->
    <rect x="48" y="110" width="864" height="48" rx="16" fill="#e3f2fd"/>
    <rect x="48" y="140" width="864" height="18" fill="#e3f2fd"/>
    <text x="72" y="140" font-size="15" font-weight="700" fill="#0d47a1">Venta en Ruta · Carga de camión</text>

    <!-- truck card -->
    <rect x="72" y="180" width="280" height="210" rx="14" fill="#f5f7fb" stroke="#cfd8dc"/>
    <text x="212" y="220" text-anchor="middle" font-size="40">=š</text>
    <text x="212" y="260" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1">Camión RT-03</text>
    <text x="212" y="285" text-anchor="middle" font-size="13" fill="#546e7a">Recolector: Luis</text>
    <rect x="112" y="310" width="200" height="40" rx="10" fill="url(#brand)"/>
    <text x="212" y="336" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Cargar productos</text>

    <!-- flow -->
    <text x="420" y="210" font-size="14" font-weight="700" fill="#0d47a1">Flujo al confirmar carga</text>
    <rect x="400" y="230" width="480" height="48" rx="10" fill="#ffebee"/>
    <text x="420" y="260" font-size="14" font-weight="600" fill="#c62828">1. CEDIS  piezas (sale de bodega)</text>
    <rect x="400" y="290" width="480" height="48" rx="10" fill="#e3f2fd"/>
    <text x="420" y="320" font-size="14" font-weight="600" fill="#1565c0">2. Camión recibe el inventario de ruta</text>
    <rect x="400" y="350" width="480" height="48" rx="10" fill="#e8f5e9"/>
    <text x="420" y="380" font-size="14" font-weight="600" fill="#1b5e20">3. POS de ruta vende desde esa carga</text>
  </g>
</svg>
