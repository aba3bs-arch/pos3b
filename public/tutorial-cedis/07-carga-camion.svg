<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fa"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#e6c35c"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0d47a1" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">7. Carga de camion (Venta en Ruta)</text>
  <text x="48" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Al cargar, el stock sale de CEDIS hacia el camion</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="864" height="320" rx="16" fill="#fff"/>
    <rect x="48" y="110" width="864" height="48" rx="16" fill="#e3f2fd"/>
    <rect x="48" y="140" width="864" height="18" fill="#e3f2fd"/>
    <text x="72" y="140" font-size="15" font-weight="700" fill="#0d47a1">Venta en Ruta - Carga de camion</text>
    <rect x="72" y="180" width="280" height="210" rx="14" fill="#f5f7fb" stroke="#cfd8dc"/>
    <rect x="140" y="200" width="100" height="45" rx="4" fill="#0f766e"/>
    <rect x="240" y="215" width="45" height="30" rx="3" fill="#115e59"/>
    <circle cx="165" cy="250" r="10" fill="#263238"/>
    <circle cx="255" cy="250" r="10" fill="#263238"/>
    <text x="212" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#0d47a1">Camion RT-03</text>
    <text x="212" y="308" text-anchor="middle" font-size="13" fill="#546e7a">Recolector: Luis</text>
    <rect x="112" y="325" width="200" height="40" rx="10" fill="url(#brand)"/>
    <text x="212" y="351" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Cargar productos</text>
    <text x="420" y="210" font-size="14" font-weight="700" fill="#0d47a1">Flujo al confirmar carga</text>
    <rect x="400" y="230" width="480" height="48" rx="10" fill="#ffebee"/>
    <text x="420" y="260" font-size="14" font-weight="600" fill="#c62828">1. CEDIS - piezas (sale de bodega)</text>
    <rect x="400" y="290" width="480" height="48" rx="10" fill="#e3f2fd"/>
    <text x="420" y="320" font-size="14" font-weight="600" fill="#1565c0">2. Camion recibe el inventario de ruta</text>
    <rect x="400" y="350" width="480" height="48" rx="10" fill="#e8f5e9"/>
    <text x="420" y="380" font-size="14" font-weight="600" fill="#1b5e20">3. POS de ruta vende desde esa carga</text>
  </g>
</svg>
