<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fa"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">5 · Ingreso al stock CEDIS</text>
  <text x="48" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Ajuste de inventario o recepción de compra ? bodega central</text>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="360" height="320" rx="16" fill="#fff"/>
    <rect x="120" y="150" width="220" height="140" rx="12" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="230" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1">CEDIS</text>
    <rect x="185" y="195" width="90" height="55" rx="6" fill="#1565c0"/>
    <polygon points="185,195 230,175 275,195" fill="#0d47a1"/>
    <rect x="215" y="215" width="30" height="35" fill="#e3f2fd"/>
    <text x="230" y="275" text-anchor="middle" font-size="13" fill="#546e7a">stock_cedis</text>
    <polygon points="220,335 230,355 240,335" fill="#2e7d32"/>
    <line x1="230" y1="300" x2="230" y2="335" stroke="#2e7d32" stroke-width="4"/>
    <rect x="150" y="365" width="160" height="40" rx="10" fill="#e8f5e9"/>
    <text x="230" y="391" text-anchor="middle" font-size="14" font-weight="700" fill="#1b5e20">+ Entrada</text>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="440" y="110" width="472" height="320" rx="16" fill="#fff"/>
    <text x="464" y="150" font-size="16" font-weight="700" fill="#0d47a1">Cómo entrar mercancía</text>

    <rect x="464" y="175" width="424" height="70" rx="12" fill="#e3f2fd"/>
    <text x="484" y="205" font-size="15" font-weight="700" fill="#0d47a1">A) Productos ? Ajuste de inventario</text>
    <text x="484" y="228" font-size="13" fill="#546e7a">Modo entrada · suma a stock CEDIS</text>

    <rect x="464" y="260" width="424" height="70" rx="12" fill="#e8f5e9"/>
    <text x="484" y="290" font-size="15" font-weight="700" fill="#1b5e20">B) Compras ? recepción</text>
    <text x="484" y="313" font-size="13" fill="#546e7a">Al recibir, el stock llega a la bodega central</text>

    <rect x="464" y="345" width="424" height="60" rx="12" fill="#fff8e1"/>
    <text x="484" y="375" font-size="14" font-weight="600" fill="#e65100">En CEDIS editas stock de almacén, no el piso de tienda</text>
  </g>
</svg>
