<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fa"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#e6c35c"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0d47a1" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">1 · Entra como CEDIS</text>
  <text x="48" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Centro de distribución · no es lo mismo que MAIN</text>

  <!-- Login card -->
  <g filter="url(#shadow)">
    <rect x="48" y="110" width="400" height="320" rx="18" fill="#fff"/>
    <rect x="48" y="110" width="400" height="56" rx="18" fill="url(#brand)"/>
    <rect x="48" y="148" width="400" height="18" fill="#0d47a1"/>
    <text x="248" y="145" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">POS CONTROL 3B</text>
    <text x="80" y="200" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#78909c" font-weight="700">SUCURSAL</text>
    <rect x="80" y="212" width="336" height="48" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="100" y="242" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#0d47a1">CEDIS · centro de distribución</text>
    <text x="80" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#78909c" font-weight="700">PIN</text>
    <rect x="80" y="307" width="336" height="44" rx="10" fill="#f5f7fb" stroke="#cfd8dc"/>
    <text x="248" y="335" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#0d47a1" letter-spacing="6">""""</text>
    <rect x="80" y="370" width="336" height="42" rx="10" fill="url(#brand)"/>
    <text x="248" y="397" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Entrar</text>
  </g>

  <!-- Comparison cards -->
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="490" y="110" width="422" height="140" rx="16" fill="#fff"/>
    <rect x="510" y="128" width="56" height="28" rx="8" fill="url(#brand)"/>
    <text x="538" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CEDIS</text>
    <text x="580" y="148" font-size="16" font-weight="700" fill="#0d47a1">Almacén central</text>
    <text x="510" y="185" font-size="14" fill="#455a64">" Stock de bodega (stock_cedis)</text>
    <text x="510" y="210" font-size="14" fill="#455a64">" Catálogo propio (cigarros, ropa&)</text>
    <text x="510" y="235" font-size="14" fill="#455a64">" Carga camiones y traspasos a tienda</text>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="490" y="270" width="422" height="160" rx="16" fill="#fff"/>
    <rect x="510" y="288" width="56" height="28" rx="8" fill="url(#gold)"/>
    <text x="538" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#3e2723">MAIN</text>
    <text x="580" y="308" font-size="16" font-weight="700" fill="#5d4037">Consola admin</text>
    <text x="510" y="345" font-size="14" fill="#455a64">" No opera el piso de CEDIS</text>
    <text x="510" y="370" font-size="14" fill="#455a64">" Configura cadena, RH, reportes</text>
    <text x="510" y="395" font-size="14" fill="#455a64">" Favoritos globales de tiendas</text>
  </g>
</svg>
