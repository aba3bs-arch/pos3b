<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8f0fa"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#e6c35c"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0d47a1" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">3. Departamentos propios</text>
  <text x="48" y="80" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Crea deptos solo para CEDIS - no ensucian el menu de tiendas</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="420" height="320" rx="16" fill="#fff"/>
    <text x="72" y="150" font-size="16" font-weight="700" fill="#0d47a1">Nuevo / editar producto</text>
    <text x="72" y="190" font-size="12" fill="#78909c" font-weight="700">DEPARTAMENTO</text>
    <rect x="72" y="200" width="370" height="42" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="90" y="227" font-size="15" font-weight="600" fill="#0d47a1">CIGARROS</text>
    <text x="72" y="275" font-size="12" fill="#78909c" font-weight="700">NUEVO DEPARTAMENTO CEDIS</text>
    <rect x="72" y="285" width="250" height="42" rx="10" fill="#f5f7fb" stroke="#cfd8dc"/>
    <text x="90" y="312" font-size="14" fill="#90a4ae">Ej. ACCESORIOS</text>
    <rect x="332" y="285" width="110" height="42" rx="10" fill="url(#brand)"/>
    <text x="387" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Agregar</text>
    <rect x="72" y="350" width="370" height="54" rx="10" fill="#fff8e1"/>
    <text x="90" y="375" font-size="13" font-weight="600" fill="#e65100">Solo catalogo CEDIS</text>
    <text x="90" y="395" font-size="12" fill="#795548">No aparece vacio en el menu de 3B2, 3B5...</text>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="500" y="110" width="412" height="320" rx="16" fill="#fff"/>
    <text x="524" y="150" font-size="15" font-weight="700" fill="#0d47a1">Base del catalogo CEDIS</text>
    <g font-size="14" fill="#37474f">
      <circle cx="536" cy="185" r="5" fill="#1565c0"/><text x="552" y="190">CIGARROS</text>
      <circle cx="536" cy="218" r="5" fill="#1565c0"/><text x="552" y="223">BLUNTWRAP</text>
      <circle cx="536" cy="251" r="5" fill="#1565c0"/><text x="552" y="256">ELECTRONICOS</text>
      <circle cx="536" cy="284" r="5" fill="#1565c0"/><text x="552" y="289">ABARROTES</text>
      <circle cx="536" cy="317" r="5" fill="#1565c0"/><text x="552" y="322">MEDICAMENTO</text>
      <circle cx="536" cy="350" r="5" fill="#1565c0"/><text x="552" y="355">ROPA</text>
      <circle cx="536" cy="383" r="5" fill="#2e7d32"/><text x="552" y="388" font-weight="700" fill="#2e7d32">+ ACCESORIOS (creado)</text>
    </g>
  </g>
</svg>
