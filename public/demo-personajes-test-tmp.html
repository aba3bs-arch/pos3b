<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prueba: personajes con movimiento y voz (Libro diario)</title>
  <style>
    :root { --crema: #fbf1dc; --azul: #1e5bb8; --texto: #2a2118; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; font-family: system-ui, sans-serif; background: #f4ecd8; color: var(--texto); }
    .wrap { max-width: 980px; margin: 0 auto; }
    h1 { font-size: 1.15rem; margin: 0 0 0.2rem; }
    .sub { margin: 0 0 0.8rem; font-size: 0.85rem; color: #6b5d48; }

    .escena { position: relative; width: 100%; aspect-ratio: 1117 / 640; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.18); background: var(--crema) url("demo-personajes/escena.jpg") center / 100% 100% no-repeat; }
    .pj { position: absolute; transform-origin: 50% 100%; will-change: transform, filter; pointer-events: none; }
    .pj img { display: block; width: 100%; height: 100%; }
    .pj.respira { animation: respira 3.6s ease-in-out infinite; }
    .pj.habla { animation: habla 0.42s ease-in-out infinite; filter: drop-shadow(0 0 7px rgba(255, 196, 0, .95)) drop-shadow(0 0 2px rgba(255, 140, 0, .9)); z-index: 5; }
    .pj.escucha { animation: escucha 2.4s ease-in-out infinite; }
    @keyframes respira { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.012,1.018); } }
    @keyframes habla {
      0%   { transform: scale(1,1) rotate(0deg); }
      25%  { transform: scale(1.02,1.05) rotate(-0.8deg); }
      50%  { transform: scale(1.01,1.012) rotate(0deg); }
      75%  { transform: scale(1.02,1.05) rotate(0.8deg); }
      100% { transform: scale(1,1) rotate(0deg); }
    }
    @keyframes escucha { 0%,100% { transform: scale(1,1) rotate(0deg); } 50% { transform: scale(1.008,1.02) rotate(0.5deg); } }

    .dialogo { position: relative; margin-top: 18px; background: #fff; border: 3px solid var(--azul); border-radius: 14px; padding: 0.7rem 0.9rem; min-height: 4.6rem; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
    .dialogo::before { content: ""; position: absolute; top: -14px; left: var(--punta, 50%); width: 22px; height: 22px; background: #fff; border-left: 3px solid var(--azul); border-top: 3px solid var(--azul); transform: translateX(-50%) rotate(45deg); transition: left .35s ease; }
    .nombre { font-weight: 800; font-size: 0.85rem; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 0.15rem; }
    .texto { font-size: 1.12rem; line-height: 1.45; }

    .barra { margin-top: 0.8rem; display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    button { font: inherit; font-weight: 700; border: 0; border-radius: 10px; padding: 0.55rem 1rem; cursor: pointer; background: var(--azul); color: #fff; }
    button.sec { background: #e7dcc0; color: var(--texto); }
    button:disabled { opacity: .5; cursor: default; }
    .progreso { margin-left: auto; font-size: 0.85rem; color: #6b5d48; }
    label.chk { display: inline-flex; gap: 0.35rem; align-items: center; font-size: 0.9rem; }
    .aviso { margin-top: 0.6rem; font-size: 0.82rem; color: #8a5a00; background: #fff3cd; border-radius: 8px; padding: 0.45rem 0.7rem; display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Prueba · Libro diario con personajes que se mueven y hablan</h1>
    <p class="sub">Versión de prueba (nivel 1): el personaje que habla rebota y brilla; la voz sale de este aparato.</p>

    <div class="escena" id="escena" aria-label="Escena del Libro diario"></div>

    <div class="dialogo" id="dialogo" aria-live="polite">
      <div class="nombre" id="nombre">Toca «Empezar»</div>
      <div class="texto" id="texto">Los personajes te van a explicar cómo leer el Libro diario.</div>
    </div>

    <div class="barra">
      <button id="btnEmpezar">Empezar</button>
      <button id="btnPausa" class="sec" disabled>Pausa</button>
      <button id="btnSig" class="sec" disabled>Siguiente</button>
      <label class="chk"><input type="checkbox" id="chkVoz" checked /> Con voz</label>
      <span class="progreso" id="progreso"></span>
    </div>
    <div class="aviso" id="aviso"></div>
  </div>

  <script>
    var W = 1117, H = 640;
    var PERSONAJES = {
      maestro:  { nombre: 'Maestro',  color: '#1e5bb8', caja: [10, 120, 255, 585],  pitch: 0.55, rate: 0.95, img: 'maestro.png' },
      maestra:  { nombre: 'Maestra',  color: '#b0286b', caja: [620, 88, 830, 545],  pitch: 1.35, rate: 1.0,  img: 'maestra.png' },
      pan:      { nombre: 'Pan',      color: '#b86b00', caja: [815, 180, 975, 520], pitch: 1.0,  rate: 1.08, img: 'pan.png' },
      refresco: { nombre: 'Refresco', color: '#6b2d12', caja: [955, 200, 1100, 580], pitch: 0.8,  rate: 0.92, img: 'refresco.png' }
    };

    var GUION = [
      { quien: 'maestro',  texto: 'Bienvenidos al Libro diario. Aquí vemos, día por día, lo que entró por ventas y lo que salió por gastos.' },
      { quien: 'maestra',  texto: 'Cada renglón trae su resultado: verde si entró más de lo que salió, rojo si salió más de lo que entró.' },
      { quien: 'pan',      texto: '¿Y de dónde salen esos números?' },
      { quien: 'maestro',  texto: 'Del corte general automático de las doce y diez de la noche, hora Nogales. Lo hace el servidor, aunque nadie abra la app.' },
      { quien: 'refresco', texto: 'Entonces, ¿qué es la venta de hoy que veo en azul?' },
      { quien: 'maestra',  texto: 'Es la venta del POS en vivo. Se actualiza cada minuto y no se suma al libro hasta el corte de medianoche.' },
      { quien: 'maestro',  texto: 'Y si necesitas el recibo de cada tienda, abre el panel de Cortes generales, el CGA, y lo imprimes.' },
      { quien: 'pan',      texto: '¡Qué fácil!' },
      { quien: 'refresco', texto: '¡Vamos a practicar!' }
    ];

    var escena = document.getElementById('escena');
    var nodos = {};
    Object.keys(PERSONAJES).forEach(function (id, i) {
      var p = PERSONAJES[id], c = p.caja;
      var d = document.createElement('div');
      d.className = 'pj respira';
      d.style.left = (c[0] / W * 100) + '%';
      d.style.top = (c[1] / H * 100) + '%';
      d.style.width = ((c[2] - c[0]) / W * 100) + '%';
      d.style.height = ((c[3] - c[1]) / H * 100) + '%';
      d.style.animationDelay = (i * 0.7) + 's';
      var im = document.createElement('img');
      im.src = 'demo-personajes/' + p.img; im.alt = p.nombre;
      d.appendChild(im); escena.appendChild(d);
      nodos[id] = d;
    });

    var elDialogo = document.getElementById('dialogo');
    var elNombre = document.getElementById('nombre');
    var elTexto = document.getElementById('texto');
    var elProg = document.getElementById('progreso');
    var elAviso = document.getElementById('aviso');
    var btnE = document.getElementById('btnEmpezar');
    var btnP = document.getElementById('btnPausa');
    var btnS = document.getElementById('btnSig');
    var chkVoz = document.getElementById('chkVoz');

    var voces = [];
    function cargarVoces() {
      if (!('speechSynthesis' in window)) return;
      voces = speechSynthesis.getVoices().filter(function (v) { return /^es/i.test(v.lang); });
    }
    cargarVoces();
    if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = cargarVoces;

    function vozDe(id) {
      if (!voces.length) return null;
      var orden = Object.keys(PERSONAJES).indexOf(id);
      var mx = voces.filter(function (v) { return /MX|419|US/i.test(v.lang); });
      var base = mx.length ? mx : voces;
      return base[orden % base.length];
    }

    var idx = -1, enCurso = false, pausado = false, temporizador = null, sesion = 0;

    function marcar(quien) {
      Object.keys(nodos).forEach(function (id) {
        nodos[id].classList.remove('habla', 'respira', 'escucha');
        nodos[id].classList.add(!quien ? 'respira' : (id === quien ? 'habla' : 'escucha'));
      });
    }

    function mostrar(linea) {
      var p = PERSONAJES[linea.quien], c = p.caja;
      elNombre.textContent = p.nombre; elNombre.style.color = p.color;
      elDialogo.style.borderColor = p.color;
      elTexto.textContent = linea.texto;
      var centro = ((c[0] + c[2]) / 2) / W * 100;
      elDialogo.style.setProperty('--punta', centro + '%');
      elProg.textContent = (idx + 1) + ' de ' + GUION.length;
    }

    function terminarLinea(mi) {
      if (mi !== sesion) return;
      marcar(null);
      temporizador = setTimeout(function () { if (mi === sesion && !pausado) avanzar(); }, 650);
    }

    function decir(linea) {
      var mi = ++sesion;
      mostrar(linea); marcar(linea.quien);
      var conVoz = chkVoz.checked && 'speechSynthesis' in window;
      if (!conVoz) {
        temporizador = setTimeout(function () { terminarLinea(mi); }, Math.max(2200, linea.texto.length * 55));
        return;
      }
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(linea.texto);
      var p = PERSONAJES[linea.quien];
      u.lang = 'es-MX'; u.pitch = p.pitch; u.rate = p.rate;
      var v = vozDe(linea.quien); if (v) { u.voice = v; u.lang = v.lang; }
      var respaldo = setTimeout(function () { terminarLinea(mi); }, Math.max(4000, linea.texto.length * 120));
      u.onend = function () { clearTimeout(respaldo); terminarLinea(mi); };
      u.onerror = function () { clearTimeout(respaldo); terminarLinea(mi); };
      speechSynthesis.speak(u);
      if (!voces.length) {
        elAviso.style.display = 'block';
        elAviso.textContent = 'Este aparato no tiene una voz en español instalada; se usa la voz que traiga por defecto. En un celular o tablet Android/iPhone suele sonar mejor.';
      }
    }

    function avanzar() {
      clearTimeout(temporizador);
      idx += 1;
      if (idx >= GUION.length) {
        enCurso = false; marcar(null);
        elNombre.textContent = 'Fin'; elNombre.style.color = '#2a2118';
        elTexto.textContent = 'Eso fue todo. Toca «Empezar» para verlo otra vez.';
        btnE.textContent = 'Repetir'; btnE.disabled = false; btnP.disabled = true; btnS.disabled = true;
        elProg.textContent = '';
        return;
      }
      decir(GUION[idx]);
    }

    btnE.addEventListener('click', function () {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      clearTimeout(temporizador); sesion += 1;
      idx = -1; enCurso = true; pausado = false;
      btnE.disabled = true; btnP.disabled = false; btnS.disabled = false; btnP.textContent = 'Pausa';
      avanzar();
    });
    btnP.addEventListener('click', function () {
      if (!enCurso) return;
      pausado = !pausado;
      if (pausado) {
        if ('speechSynthesis' in window) speechSynthesis.pause();
        Object.keys(nodos).forEach(function (id) { nodos[id].style.animationPlayState = 'paused'; });
        btnP.textContent = 'Seguir';
      } else {
        if ('speechSynthesis' in window) speechSynthesis.resume();
        Object.keys(nodos).forEach(function (id) { nodos[id].style.animationPlayState = ''; });
        btnP.textContent = 'Pausa';
      }
    });
    btnS.addEventListener('click', function () {
      if (!enCurso) return;
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      pausado = false; btnP.textContent = 'Pausa';
      Object.keys(nodos).forEach(function (id) { nodos[id].style.animationPlayState = ''; });
      avanzar();
    });
  idx=1;mostrar(GUION[1]);marcar("maestra");</script>
</body>
</html>
