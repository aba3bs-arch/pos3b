<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="55%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#b91c1c" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#b91c1c">5. Qué se revierte al aprobar</text>
  <text x="40" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#546e7a">Orden fijo · si falla algo crítico, no se aprueba a medias</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="36" y="100" width="290" height="150" rx="14" fill="#fff"/>
    <circle cx="68" cy="132" r="16" fill="#0f766e"/><text x="68" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
    <text x="96" y="137" font-size="15" font-weight="700" fill="#0f766e">Camión</text>
    <text x="56" y="175" font-size="13" fill="#334155">Baja qty_vendida</text>
    <text x="56" y="200" font-size="13" fill="#334155">Piezas vuelven a Disp.</text>
    <text x="56" y="225" font-size="12" fill="#94a3b8">Inventario del recolector</text>
    <rect x="340" y="100" width="290" height="150" rx="14" fill="#fff"/>
    <circle cx="372" cy="132" r="16" fill="#0f766e"/><text x="372" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
    <text x="400" y="137" font-size="15" font-weight="700" fill="#0f766e">Tienda (piso)</text>
    <text x="360" y="175" font-size="13" fill="#334155">Si ya se recibió en Compras</text>
    <text x="360" y="200" font-size="13" fill="#334155">Descuenta el piso</text>
    <text x="360" y="225" font-size="12" fill="#94a3b8">Ej. Petroleos / 3B10</text>
    <rect x="644" y="100" width="280" height="150" rx="14" fill="#fff"/>
    <circle cx="676" cy="132" r="16" fill="#b91c1c"/><text x="676" y="137" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
    <text x="704" y="137" font-size="15" font-weight="700" fill="#b91c1c">Crédito / CxC</text>
    <text x="664" y="175" font-size="13" fill="#334155">Borra cargo (y abonos)</text>
    <text x="664" y="200" font-size="13" fill="#334155">Crédito o parte mixto</text>
    <text x="664" y="225" font-size="12" fill="#94a3b8">Créditos por pagar</text>
    <rect x="36" y="275" width="290" height="150" rx="14" fill="#fff"/>
    <circle cx="68" cy="307" r="16" fill="#b91c1c"/><text x="68" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
    <text x="96" y="312" font-size="15" font-weight="700" fill="#b91c1c">Efectivo RC</text>
    <text x="56" y="350" font-size="13" fill="#334155">Quita «Venta Ruta»</text>
    <text x="56" y="375" font-size="13" fill="#334155">de Pendientes</text>
    <text x="56" y="400" font-size="12" fill="#94a3b8">RC/VentaRuta</text>
    <rect x="340" y="275" width="290" height="150" rx="14" fill="#fff"/>
    <circle cx="372" cy="307" r="16" fill="#0f766e"/><text x="372" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
    <text x="400" y="312" font-size="15" font-weight="700" fill="#0f766e">Compra</text>
    <text x="360" y="350" font-size="13" fill="#334155">Elimina pedido / recepción</text>
    <text x="360" y="375" font-size="13" fill="#334155">ligada al folio VR</text>
    <text x="360" y="400" font-size="12" fill="#94a3b8">Módulo Compras</text>
    <rect x="644" y="275" width="280" height="150" rx="14" fill="#fff"/>
    <circle cx="676" cy="307" r="16" fill="#0f766e"/><text x="676" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">6</text>
    <text x="704" y="312" font-size="15" font-weight="700" fill="#0f766e">Venta</text>
    <text x="664" y="350" font-size="13" fill="#334155">Borra el folio</text>
    <text x="664" y="375" font-size="13" fill="#334155">Historial en cancelaciones</text>
    <text x="664" y="400" font-size="12" fill="#94a3b8">ruta_ventas</text>
