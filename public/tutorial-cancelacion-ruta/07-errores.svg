<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="55%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#b91c1c" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#b91c1c">7. Errores típicos</text>
  <text x="40" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#546e7a">Evita estos tropiezos al cancelar ventas de ruta</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="100" width="880" height="330" rx="16" fill="#fff"/>
    <g font-size="15">
      <rect x="64" y="130" width="28" height="28" rx="8" fill="#fee2e2"/><text x="78" y="150" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="108" y="150" fill="#334155">Pedir cancelación y <tspan font-weight="700">no esperar el PIN</tspan> del admin (nada se borra)</text>
      <rect x="64" y="180" width="28" height="28" rx="8" fill="#fee2e2"/><text x="78" y="200" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="108" y="200" fill="#334155">Confundir con <tspan font-weight="700">Cancelar carga</tspan> (eso es mercancía sin vender → CEDIS)</text>
      <rect x="64" y="230" width="28" height="28" rx="8" fill="#fee2e2"/><text x="78" y="250" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="108" y="250" fill="#334155">Creer que <tspan font-weight="700">Eliminar ingreso</tspan> revierte una venta (solo borra el ticket de carga)</text>
      <rect x="64" y="280" width="28" height="28" rx="8" fill="#fee2e2"/><text x="78" y="300" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="108" y="300" fill="#334155">Cancelar con efectivo ya <tspan font-weight="700">Liquidado</tspan> en RC (hay que aclarar a mano)</text>
      <rect x="64" y="330" width="28" height="28" rx="8" fill="#fee2e2"/><text x="78" y="350" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="108" y="350" fill="#334155">Olvidar el motivo claro (el admin necesita saber por qué aprueba)</text>
      <rect x="64" y="385" width="832" height="30" rx="8" fill="#ecfdf5"/>
      <text x="82" y="405" font-size="13" font-weight="600" fill="#0f766e">✓ Pides · admin aprueba · inventario vuelve · crédito y efectivo desaparecen</text>
    </g>
  </g>
</svg>
