<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="55%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#b91c1c" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#b91c1c">6. Caso especial: pago mixto</text>
  <text x="40" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#546e7a">Efectivo + crédito en la misma venta · al cancelar se limpian los dos</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="105" width="420" height="320" rx="16" fill="#fff"/>
    <rect x="40" y="105" width="420" height="48" fill="#ecfdf5"/>
    <text x="60" y="135" font-size="14" font-weight="700" fill="#0f766e">Antes · venta mixto $420</text>
    <rect x="70" y="180" width="360" height="90" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="90" y="215" font-size="15" font-weight="700" fill="#0f766e">Efectivo $200</text>
    <text x="90" y="245" font-size="13" fill="#334155">→ RC/VentaRuta (Pendientes)</text>
    <rect x="70" y="290" width="360" height="90" rx="12" fill="#fef2f2" stroke="#fecaca"/>
    <text x="90" y="325" font-size="15" font-weight="700" fill="#b91c1c">Crédito $220</text>
    <text x="90" y="355" font-size="13" fill="#334155">→ CxC / Créditos por pagar</text>
    <rect x="500" y="105" width="420" height="320" rx="16" fill="#fff"/>
    <rect x="500" y="105" width="420" height="48" fill="#fef2f2"/>
    <text x="520" y="135" font-size="14" font-weight="700" fill="#b91c1c">Después · cancelación aprobada</text>
    <rect x="530" y="180" width="360" height="70" rx="12" fill="#ecfdf5"/>
    <text x="550" y="222" font-size="14" font-weight="700" fill="#0f766e">✓ Efectivo salió de RC</text>
    <rect x="530" y="265" width="360" height="70" rx="12" fill="#ecfdf5"/>
    <text x="550" y="307" font-size="14" font-weight="700" fill="#0f766e">✓ Crédito borrado en CxC</text>
    <rect x="530" y="350" width="360" height="50" rx="12" fill="url(#brand)"/>
    <text x="710" y="382" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">+ Inventario completo al camión</text>
  </g>
</svg>
