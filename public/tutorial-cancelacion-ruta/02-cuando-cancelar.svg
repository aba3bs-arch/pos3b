<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="55%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#b91c1c" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#b91c1c">2. ¿Cuándo sí cancelar?</text>
  <text x="40" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#546e7a">Venta ya cobrada y mal registrada · no uses esto para cargas vacías</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="100" width="280" height="200" rx="16" fill="#fff"/>
    <rect x="40" y="100" width="280" height="44" rx="16" fill="#fef2f2"/>
    <rect x="40" y="128" width="280" height="16" fill="#fef2f2"/>
    <text x="60" y="128" font-size="14" font-weight="700" fill="#b91c1c">✓ Tienda equivocada</text>
    <text x="60" y="175" font-size="14" fill="#334155">Cobraste a 3B3 y era 3B10</text>
    <text x="60" y="205" font-size="14" fill="#334155">(o cliente externo mal).</text>
    <text x="60" y="250" font-size="13" fill="#94a3b8">Solicita cancelación + vuelve a vender</text>
    <rect x="340" y="100" width="280" height="200" rx="16" fill="#fff"/>
    <rect x="340" y="100" width="280" height="44" rx="16" fill="#fef2f2"/>
    <rect x="340" y="128" width="280" height="16" fill="#fef2f2"/>
    <text x="360" y="128" font-size="14" font-weight="700" fill="#b91c1c">✓ Método incorrecto</text>
    <text x="360" y="175" font-size="14" fill="#334155">Crédito cuando iba efectivo</text>
    <text x="360" y="205" font-size="14" fill="#334155">o mixto con montos mal.</text>
    <text x="360" y="250" font-size="13" fill="#94a3b8">Al aprobar limpia CxC y/o RC</text>
    <rect x="640" y="100" width="280" height="200" rx="16" fill="#fff"/>
    <rect x="640" y="100" width="280" height="44" rx="16" fill="#fef2f2"/>
    <rect x="640" y="128" width="280" height="16" fill="#fef2f2"/>
    <text x="660" y="128" font-size="14" font-weight="700" fill="#b91c1c">✓ Cantidad / producto</text>
    <text x="660" y="175" font-size="14" fill="#334155">Piezas de más o producto</text>
    <text x="660" y="205" font-size="14" fill="#334155">que no debió salir.</text>
    <text x="660" y="250" font-size="13" fill="#94a3b8">Inventario vuelve al camión</text>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="330" width="880" height="110" rx="16" fill="#fff"/>
    <rect x="40" y="330" width="8" height="110" rx="4" fill="#0f766e"/>
    <text x="70" y="370" font-size="15" font-weight="700" fill="#0f766e">✗ No uses cancelación de venta para…</text>
    <text x="70" y="405" font-size="14" fill="#334155">Carga sin ventas → <tspan font-weight="700">Consultas → Cargas → Cancelar</tspan> (regresa a CEDIS).</text>
    <text x="70" y="430" font-size="14" fill="#334155">Solo borrar un ticket de carga → <tspan font-weight="700">Eliminar ingreso</tspan> (no mueve inventario ni ventas).</text>
  </g>
</svg>
