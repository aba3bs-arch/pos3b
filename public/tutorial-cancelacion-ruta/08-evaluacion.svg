<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="55%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#b91c1c" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="40" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f766e">8. Evaluación</text>
  <text x="40" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#546e7a">8 preguntas · apruebas con 70% o más (C o mejor)</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="120" y="110" width="720" height="300" rx="20" fill="#fff"/>
    <circle cx="480" cy="210" r="70" fill="url(#brand)"/>
    <text x="480" y="225" text-anchor="middle" font-size="48" font-weight="700" fill="#fff">B</text>
    <text x="480" y="310" text-anchor="middle" font-size="22" font-weight="700" fill="#0f766e">87% · 7 / 8 correctas</text>
    <text x="480" y="345" text-anchor="middle" font-size="14" fill="#64748b">Aprobado · ya puedes capacitar al equipo</text>
    <text x="480" y="375" text-anchor="middle" font-size="13" fill="#94a3b8">Si fallas: repasa PIN admin, mixto y qué se revierte</text>
  </g>
</svg>
