<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="40" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">Cómo solicitar un CT (cajero)</text>
  <text x="40" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#546e7a">5 pasos — del Checador al PIN temporal del CT</text>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#fff">
    <rect x="40" y="130" width="150" height="78" rx="14" fill="#0d47a1"/><text x="115" y="165" text-anchor="middle">1. Checador</text><text x="115" y="185" text-anchor="middle" font-size="12" fill="#bbdefb">Cubre turnos</text>
    <rect x="220" y="130" width="150" height="78" rx="14" fill="#1565c0"/><text x="295" y="165" text-anchor="middle">2. CT verde</text><text x="295" y="185" text-anchor="middle" font-size="12" fill="#bbdefb">Disponible</text>
    <rect x="400" y="130" width="150" height="78" rx="14" fill="#1976d2"/><text x="475" y="165" text-anchor="middle">3. Enviar</text><text x="475" y="185" text-anchor="middle" font-size="12" fill="#bbdefb">Solicitud</text>
    <rect x="580" y="130" width="150" height="78" rx="14" fill="#2e7d32"/><text x="655" y="165" text-anchor="middle">4. CT acepta</text><text x="655" y="185" text-anchor="middle" font-size="12" fill="#c8e6c9">En su celular</text>
    <rect x="760" y="130" width="150" height="78" rx="14" fill="#f9a825"/><text x="835" y="165" text-anchor="middle" fill="#212121">5. PIN temp.</text><text x="835" y="185" text-anchor="middle" font-size="12" fill="#5d4037">Para la caja</text>
  </g>
  <path d="M190 169 H220 M370 169 H400 M550 169 H580 M730 169 H760" stroke="#90a4ae" stroke-width="3"/>
  <text x="40" y="270" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#37474f">También puedes pedir desde Plan horario → celda de descanso → Pedir CT.</text>
  <text x="40" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#37474f">Tú no generas el PIN temporal: aparece cuando el CT acepta en su app.</text>

</svg>
