<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="40" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">4 · Opción: Plan horario</text>
  <text x="40" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#546e7a">En la celda de descanso → Pedir CT</text>
  <g filter="url(#shadow)">
    <rect x="60" y="110" width="840" height="280" rx="16" fill="#fff"/>
    <!-- calendar header -->
    <text x="90" y="150" font-size="14" font-weight="700" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">LUN</text>
    <text x="210" y="150" font-size="14" font-weight="700" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">MAR</text>
    <text x="330" y="150" font-size="14" font-weight="700" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">MIÉ</text>
    <text x="450" y="150" font-size="14" font-weight="700" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">JUE</text>
    <text x="570" y="150" font-size="14" font-weight="700" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">VIE</text>
    <text x="690" y="150" font-size="14" font-weight="700" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">SÁB</text>
    <text x="810" y="150" font-size="14" font-weight="700" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">DOM</text>
    <!-- cells -->
    <rect x="70" y="170" width="100" height="80" rx="8" fill="#e3f2fd"/>
    <text x="120" y="215" text-anchor="middle" font-size="12" fill="#1565c0" font-family="Segoe UI,Arial,sans-serif">Día</text>
    <rect x="190" y="170" width="100" height="80" rx="8" fill="#e3f2fd"/>
    <rect x="310" y="170" width="100" height="80" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="360" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#e65100" font-family="Segoe UI,Arial,sans-serif">DESCANSO</text>
    <text x="360" y="228" text-anchor="middle" font-size="11" fill="#2e7d32" font-family="Segoe UI,Arial,sans-serif">Pedir CT</text>
    <rect x="430" y="170" width="100" height="80" rx="8" fill="#e3f2fd"/>
    <rect x="550" y="170" width="100" height="80" rx="8" fill="#e3f2fd"/>
    <rect x="670" y="170" width="100" height="80" rx="8" fill="#e8f5e9"/>
    <text x="720" y="215" text-anchor="middle" font-size="11" fill="#2e7d32" font-family="Segoe UI,Arial,sans-serif">CT Ana</text>
    <rect x="790" y="170" width="100" height="80" rx="8" fill="#e3f2fd"/>
    <text x="90" y="310" font-size="14" fill="#455a64" font-family="Segoe UI,Arial,sans-serif">La solicitud queda ligada a ese día del plan.</text>
  </g>

</svg>
