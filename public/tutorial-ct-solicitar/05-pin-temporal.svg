<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="40" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">5 · El CT acepta → PIN temporal</text>
  <g filter="url(#shadow)">
    <rect x="80" y="100" width="340" height="280" rx="28" fill="#1a237e"/>
    <rect x="94" y="130" width="312" height="220" rx="12" fill="#fff"/>
    <text x="250" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#0d47a1" font-family="Segoe UI,Arial,sans-serif">App del CT</text>
    <rect x="120" y="185" width="260" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-dasharray="5 3"/>
    <text x="250" y="220" text-anchor="middle" font-size="12" fill="#1b5e20" font-family="Segoe UI,Arial,sans-serif">NIP temporal</text>
    <text x="250" y="255" text-anchor="middle" font-size="32" font-weight="800" fill="#2e7d32" font-family="ui-monospace,monospace">4821</text>
    <text x="250" y="310" text-anchor="middle" font-size="12" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">3B2 Pueblo Nuevo</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="480" y="120" width="420" height="240" rx="16" fill="#fff" filter="url(#shadow)"/>
    <text x="510" y="165" font-size="16" font-weight="700" fill="#0d47a1">Qué debes saber (caja)</text>
    <text x="510" y="205" font-size="14" fill="#37474f">• El CT usa ese PIN en la caja de tu tienda</text>
    <text x="510" y="235" font-size="14" fill="#37474f">• No uses el PIN móvil del CT en caja</text>
    <text x="510" y="265" font-size="14" fill="#37474f">• Vigencia: hasta cierre + ~60 min</text>
    <text x="510" y="305" font-size="14" font-weight="700" fill="#2e7d32">Tú solo pediste; el sistema genera el PIN</text>
  </g>

</svg>
