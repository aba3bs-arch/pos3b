    <text x="235" y="212" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#c62828">Mar · Descanso</text>
    <text x="235" y="232" text-anchor="middle" font-family="Arial" font-size="11" fill="#c62828">← aquí pides CT</text>
    <rect x="310" y="180" width="110" height="70" rx="8" fill="#e3f2fd" stroke="#90caf9"/>
