    <circle cx="85" cy="170" r="8" fill="#2e7d32"/><text x="110" y="175" font-size="14" fill="#263238" font-family="Segoe UI,Arial,sans-serif">Ana López · 100% · Día/noche</text>
    <circle cx="85" cy="215" r="8" fill="#2e7d32"/><text x="110" y="220" font-size="14" fill="#263238" font-family="Segoe UI,Arial,sans-serif">Luis Pérez · 95% · Solo día</text>
    <circle cx="85" cy="260" r="8" fill="#c62828"/><text x="110" y="265" font-size="14" fill="#78909c" font-family="Segoe UI,Arial,sans-serif">María R. · cubriendo hoy</text>
    <circle cx="85" cy="305" r="8" fill="#2e7d32"/><text x="110" y="310" font-size="14" fill="#263238" font-family="Segoe UI,Arial,sans-serif">Carlos M. · disponible</text>
    <text x="70" y="370" font-size="12" fill="#546e7a" font-family="Segoe UI,Arial,sans-serif">Verde = se puede solicitar · Rojo = no</text>
  </g>
  <g filter="url(#shadow)">
