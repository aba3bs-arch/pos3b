<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  
  <rect x="30" y="30" width="840" height="360" rx="16" fill="#fff" stroke="#cfd8dc"/>
  <text x="50" y="70" font-family="Arial" font-size="22" font-weight="700" fill="#0d47a1">Elige un CT disponible (verde)</text>
  <text x="50" y="100" font-family="Arial" font-size="15" fill="#546e7a">Solo aparecen CT en verde = pueden cubrir. Rojo = ocupado / hold.</text>
  <g font-family="Arial">
    <circle cx="70" cy="150" r="8" fill="#2e7d32"/>
    <text x="90" y="156" font-size="16" fill="#212121">Ana CT · disponible · Día/noche</text>
    <rect x="700" y="135" width="120" height="36" rx="8" fill="#2e7d32"/><text x="760" y="158" text-anchor="middle" fill="#fff" font-weight="700">Elegir</text>
    <circle cx="70" cy="210" r="8" fill="#c62828"/>
    <text x="90" y="216" font-size="16" fill="#757575">Luis CT · cubriendo / hold</text>
    <circle cx="70" cy="270" r="8" fill="#2e7d32"/>
    <text x="90" y="276" font-size="16" fill="#212121">María CT · disponible · Solo día</text>
    <rect x="700" y="255" width="120" height="36" rx="8" fill="#2e7d32"/><text x="760" y="278" text-anchor="middle" fill="#fff" font-weight="700">Elegir</text>
  </g>
  <text x="50" y="340" font-family="Arial" font-size="14" fill="#37474f">Confirma fecha y turno → Enviar solicitud. El CT la verá en su celular.</text>

</svg>
