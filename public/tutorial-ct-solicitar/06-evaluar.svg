<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#f7f9fc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0d47a1" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="40" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#0d47a1">6 · Después: evalúa al CT</text>
  <g filter="url(#shadow)">
    <rect x="80" y="100" width="800" height="260" rx="16" fill="#fff"/>
    <text x="110" y="150" font-size="16" font-weight="700" fill="#0d47a1" font-family="Segoe UI,Arial,sans-serif">Evaluación post-cobertura</text>
    <text x="110" y="190" font-size="14" fill="#455a64" font-family="Segoe UI,Arial,sans-serif">☐ Consumo / faltantes · ☐ Cigarros · ☐ Dinero · ☐ Quejas</text>
    <text x="110" y="230" font-size="14" fill="#455a64" font-family="Segoe UI,Arial,sans-serif">Calificación → sube o baja el % de aceptación del CT</text>
    <rect x="110" y="270" width="200" height="44" rx="10" fill="url(#brand)"/>
    <text x="210" y="298" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Guardar evaluación</text>
    <text x="350" y="298" font-size="13" fill="#c62828" font-family="Segoe UI,Arial,sans-serif">Si baja de 60% → se bloquea su app</text>
  </g>

</svg>
