<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef8f6"/><stop offset="100%" stop-color="#f5f7fb"/></linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">1. El análisis responde dos preguntas</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Estadísticas → Abarrotes → «Venta en ruta vs recolección»</text>
  <rect x="48" y="110" width="420" height="300" rx="14" fill="#fff" filter="url(#shadow)"/>
  <rect x="492" y="110" width="420" height="300" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="72" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#0f766e" text-anchor="start">Pregunta 1 · ¿Hay rendimiento?</text>
  <text x="72" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Lo que vendió la ruta</text>
  <text x="72" y="214" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">− costo de compra de lo vendido</text>
  <text x="72" y="238" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">− gastos de ruta</text>
  <text x="72" y="282" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f766e" text-anchor="start">= rendimiento neto de la ruta</text>
  <text x="72" y="326" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#546e7a" text-anchor="start">Se desglosa por proveedor y por tienda.</text>
  <text x="72" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="start">Si es ≤ $0 → la ruta no deja ganancia.</text>
  <text x="516" y="150" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#b45309" text-anchor="start">Pregunta 2 · ¿Salió de más?</text>
  <text x="516" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Neto de la tienda = venta − gastos del corte</text>
  <text x="516" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">Salido = recolección en efectivo</text>
  <text x="516" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#334155" text-anchor="start">         + pago con tarjeta (electrónico)</text>
  <text x="516" y="290" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="start">Diferencia = salido − neto</text>
  <text x="516" y="330" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#546e7a" text-anchor="start">Diferencia positiva = salió más dinero del que</text>
  <text x="516" y="350" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="start">la tienda generó: sale de lo de otros proveedores.</text>
</svg>
