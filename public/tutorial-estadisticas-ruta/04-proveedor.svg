<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef8f6"/><stop offset="100%" stop-color="#f5f7fb"/></linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">4. Tabla por proveedor: dónde se gana y dónde no</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Margen = ganancia ÷ venta con costo capturado</text>
  <rect x="48" y="100" width="864" height="250" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="80" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#546e7a" text-anchor="start">Proveedor</text>
  <text x="330" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#546e7a" text-anchor="start">Venta</text>
  <text x="450" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#546e7a" text-anchor="start">Costo</text>
  <text x="570" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#546e7a" text-anchor="start">Ganancia</text>
  <text x="700" y="140" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#546e7a" text-anchor="start">Margen</text>
  <text x="80" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Marlboro</text>
  <text x="330" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">$60.00</text>
  <text x="450" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">$50.00</text>
  <text x="570" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#27ae60" text-anchor="start">$10.00</text>
  <text x="700" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#27ae60" text-anchor="start">16.67%</text>
  <text x="80" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Smoking</text>
  <text x="330" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">$60.00</text>
  <text x="450" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">$60.00</text>
  <text x="570" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#c0392b" text-anchor="start">$0.00</text>
  <text x="700" y="229" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#c0392b" text-anchor="start">0%</text>
  <text x="80" y="300" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#b91c1c" text-anchor="start">Smoking se vendió a su precio de costo: mueve dinero pero no deja rendimiento.</text>
  <rect x="48" y="370" width="864" height="70" rx="14" fill="#fff7ed" filter="url(#shadow)"/>
  <text x="72" y="400" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#92400e" text-anchor="start">«Sin costo»: venta de productos sin precio de compra. No entra a la ganancia; captura el costo en Productos.</text>
  <text x="72" y="422" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#92400e" text-anchor="start">Si es más del 20% de la venta, el análisis queda incompleto.</text>
</svg>
