<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eef8f6"/><stop offset="100%" stop-color="#f5f7fb"/></linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/></filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">3. Tabla por tienda: cómo sale «Recolectó de más»</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Ejemplo: tienda 3B2 en el periodo</text>
  <rect x="48" y="100" width="864" height="330" rx="14" fill="#fff" filter="url(#shadow)"/>
  <text x="80" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Venta del corte</text>
  <text x="560" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="end">$1,000.00</text>
  <text x="80" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">− Pago con tarjeta</text>
  <text x="560" y="185" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="end">$100.00</text>
  <text x="80" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">− Gastos del corte (proveedores, etc.)</text>
  <text x="560" y="225" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="end">$360.00</text>
  <text x="80" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f766e" text-anchor="start">= Neto (efectivo − gastos)</text>
  <text x="560" y="265" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f766e" text-anchor="end">$540.00</text>
  <text x="80" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="start">Recolectado (Panel RT)</text>
  <text x="560" y="305" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#334155" text-anchor="end">$700.00</text>
  <text x="80" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#c0392b" text-anchor="start">Diferencia = recolectado − neto</text>
  <text x="560" y="345" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#c0392b" text-anchor="end">+$160.00</text>
  <rect x="620" y="230" width="260" height="60" rx="12" fill="#fee2e2"/>
  <text x="750" y="266" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#b91c1c" text-anchor="middle">Recolectó de más</text>
  <text x="80" y="412" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#546e7a" text-anchor="start">Tolerancia: $50 o 5% del neto (lo que sea mayor). Dentro de eso se muestra «Cuadra».</text>
</svg>
