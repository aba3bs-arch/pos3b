<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  
  <rect x="30" y="30" width="840" height="360" rx="16" fill="#fff" stroke="#cfd8dc"/>
  <text x="50" y="70" font-family="Arial" font-size="22" font-weight="700" fill="#1b5e20">Generar PIN móvil (perfil RH del CT)</text>
  <rect x="50" y="100" width="500" height="240" rx="12" fill="#e8f5e9" stroke="#81c784"/>
  <text x="70" y="140" font-family="Arial" font-size="15" font-weight="700" fill="#1b5e20">PIN móvil del CT (app)</text>
  <text x="70" y="175" font-family="Arial" font-size="13" fill="#33691e">PIN del celular (perfil RH)</text>
  <rect x="70" y="190" width="160" height="50" rx="8" fill="#fff" stroke="#a5d6a7"/>
  <text x="150" y="223" text-anchor="middle" font-family="monospace" font-size="28" font-weight="800" fill="#1b5e20">7391</text>
  <rect x="70" y="270" width="210" height="40" rx="8" fill="#2e7d32"/>
  <text x="175" y="295" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#fff">Generar / regenerar PIN móvil</text>
  <text x="580" y="150" font-family="Arial" font-size="14" fill="#37474f">• Se ve siempre en el perfil RH</text>
  <text x="580" y="180" font-family="Arial" font-size="14" fill="#37474f">• Entrégaselo al CT</text>
  <text x="580" y="210" font-family="Arial" font-size="14" fill="#37474f">• Solo funciona en su celular</text>
  <text x="580" y="240" font-family="Arial" font-size="14" fill="#37474f">• Se ancla al primer teléfono</text>
  <text x="580" y="270" font-family="Arial" font-size="14" fill="#37474f">• “Liberar dispositivo” si cambió</text>
  <text x="580" y="300" font-family="Arial" font-size="14" fill="#37474f">  de celular</text>

</svg>
