<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <rect width="100%" height="100%" fill="#f4f7fb"/>
  
  <text x="40" y="48" font-family="Arial" font-size="26" font-weight="700" fill="#0d47a1">Los 3 PIN del sistema CT</text>
  <g font-family="Arial">
    <rect x="40" y="80" width="260" height="340" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="170" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#1b5e20">1. PIN móvil</text>
    <text x="60" y="160" font-size="14" fill="#33691e">Quién: el CT</text>
    <text x="60" y="190" font-size="14" fill="#33691e">Dónde: solo celular</text>
    <text x="60" y="220" font-size="14" fill="#33691e">Para: ver/aceptar</text>
    <text x="60" y="250" font-size="14" fill="#33691e">solicitudes</text>
    <text x="60" y="290" font-size="14" fill="#33691e">Se genera en RH</text>
    <text x="60" y="320" font-size="14" fill="#33691e">ABA3B (perfil CT)</text>
    <text x="60" y="360" font-size="13" font-weight="700" fill="#c62828">NO usar en caja</text>

    <rect x="320" y="80" width="260" height="340" rx="14" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="450" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#e65100">2. PIN temporal</text>
    <text x="340" y="160" font-size="14" fill="#5d4037">Quién: el CT</text>
    <text x="340" y="190" font-size="14" fill="#5d4037">Dónde: caja de esa</text>
    <text x="340" y="220" font-size="14" fill="#5d4037">tienda ese día</text>
    <text x="340" y="260" font-size="14" fill="#5d4037">Se crea al ACEPTAR</text>
    <text x="340" y="290" font-size="14" fill="#5d4037">la solicitud</text>
    <text x="340" y="330" font-size="14" fill="#5d4037">Parpadea en la app</text>
    <text x="340" y="360" font-size="14" fill="#5d4037">Cierra 60 min después</text>
    <text x="340" y="390" font-size="14" fill="#5d4037">del fin del turno</text>

    <rect x="600" y="80" width="260" height="340" rx="14" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="730" y="120" text-anchor="middle" font-size="18" font-weight="700" fill="#0d47a1">3. PIN de tienda</text>
    <text x="620" y="160" font-size="14" fill="#1565c0">Quién: cualquiera CT</text>
    <text x="620" y="190" font-size="14" fill="#1565c0">de esa sucursal</text>
    <text x="620" y="230" font-size="14" fill="#1565c0">Dónde: Configuración</text>
    <text x="620" y="260" font-size="14" fill="#1565c0">→ PIN cubre turno</text>
    <text x="620" y="300" font-size="14" fill="#1565c0">Es el PIN genérico</text>
    <text x="620" y="330" font-size="14" fill="#1565c0">de la tienda (nube)</text>
    <text x="620" y="370" font-size="14" fill="#1565c0">No es personal</text>
  </g>

</svg>
