<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="s" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="url(#bg)"/>
  <text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#1e3a8a">El cajero solo ve el abono</text>
  <text x="48" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#64748b">Entra a Venta en Ruta → Abono fin de año. No ve inventario ni liquidación.</text>

  <g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="116" width="560" height="360" rx="18" fill="#fff"/>
    <text x="76" y="164" font-size="20" font-weight="700" fill="#0f172a">Abono a la cuenta</text>
    <text x="76" y="192" font-size="14" fill="#64748b">Tú entregas el dinero. El repartidor lo aprueba con su PIN.</text>
    <text x="76" y="240" font-size="13" font-weight="700" fill="#334155">Monto</text>
    <rect x="76" y="252" width="150" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="92" y="282" font-size="18" fill="#0f172a">480</text>
    <text x="246" y="240" font-size="13" font-weight="700" fill="#334155">Repartidor que recibe</text>
    <rect x="246" y="252" width="200" height="48" rx="10" fill="#fff" stroke="#3730a3" stroke-width="2"/>
    <text x="262" y="282" font-size="16" fill="#312e81">Luis Enrique</text>
    <text x="466" y="240" font-size="13" font-weight="700" fill="#334155">Nota</text>
    <rect x="466" y="252" width="110" height="48" rx="10" fill="#fff" stroke="#cbd5e1"/>
    <text x="480" y="282" font-size="14" fill="#64748b">20 nov</text>
    <rect x="76" y="328" width="500" height="56" rx="12" fill="#1d4ed8"/>
    <text x="326" y="362" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Enviar abono</text>
    <text x="76" y="430" font-size="14" fill="#64748b">Nada se guarda todavía. Espera el PIN.</text>
  </g>

  <g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="636" y="116" width="276" height="360" rx="18" fill="#fff"/>
    <text x="664" y="164" font-size="16" font-weight="700" fill="#b91c1c">El cajero no ve</text>
    <text x="664" y="214" font-size="16" fill="#334155">✕  Cuentas de otras tiendas</text>
    <text x="664" y="258" font-size="16" fill="#334155">✕  Dejar mercancía</text>
    <text x="664" y="302" font-size="16" fill="#334155">✕  Liquidación</text>
    <text x="664" y="346" font-size="16" fill="#334155">✕  Editar o borrar</text>
    <rect x="664" y="390" width="220" height="52" rx="12" fill="#ecfdf5"/>
    <text x="774" y="422" text-anchor="middle" font-size="15" font-weight="700" fill="#047857">Sí ve: el formulario</text>
  </g>
</svg>
