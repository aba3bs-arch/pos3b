<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="s" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#115e59" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="url(#bg)"/>
  <text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#115e59">Así se lee la liquidación</text>
  <text x="48" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#64748b">La ve MAIN. El repartidor no tiene esta pestaña.</text>

  <g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="120" width="270" height="180" rx="16" fill="#fff"/>
    <text x="72" y="160" font-size="14" fill="#64748b">Total de las tiendas</text>
    <text x="72" y="214" font-size="40" font-weight="700" fill="#0f172a">$1,480</text>
    <text x="72" y="250" font-size="13" fill="#64748b">Lo que se dejó a crédito</text>

    <rect x="344" y="120" width="270" height="180" rx="16" fill="#fff"/>
    <text x="368" y="160" font-size="14" fill="#64748b">Abonos</text>
    <text x="368" y="214" font-size="40" font-weight="700" fill="#b45309">− $480</text>
    <text x="368" y="250" font-size="13" fill="#64748b">Lo que ya pagaron</text>

    <rect x="640" y="120" width="270" height="180" rx="16" fill="#3730a3"/>
    <text x="664" y="160" font-size="14" fill="#c7d2fe">Liquidación</text>
    <text x="664" y="214" font-size="40" font-weight="700" fill="#fff">$480</text>
    <text x="664" y="250" font-size="13" fill="#e0e7ff">Eso es lo que se cierra</text>
  </g>

  <g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="328" width="864" height="148" rx="16" fill="#fff"/>
    <text x="80" y="376" font-size="18" font-weight="700" fill="#115e59">Después de pulsar Liquidar</text>
    <text x="80" y="416" font-size="18" fill="#0f172a">El total de las tiendas baja a $1,000.</text>
    <text x="80" y="446" font-size="16" fill="#64748b">La línea de $480 queda en el registro. El siguiente abono abre otra línea.</text>
  </g>
</svg>
