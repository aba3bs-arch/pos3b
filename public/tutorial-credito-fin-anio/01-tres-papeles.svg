<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="url(#bg)"/>
  <text x="48" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#312e81">Cada quien hace una cosa</text>
  <text x="48" y="84" font-family="Segoe UI,Arial,sans-serif" font-size="16" fill="#64748b">El dinero no se anota hasta que el repartidor aprueba con su PIN</text>

  <g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="120" width="280" height="340" rx="18" fill="#fff"/>
    <rect x="40" y="120" width="280" height="8" rx="4" fill="#1d4ed8"/>
    <circle cx="180" cy="190" r="28" fill="#dbeafe"/>
    <text x="180" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#1d4ed8">$</text>
    <text x="180" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#1e3a8a">Cajero</text>
    <text x="180" y="290" text-anchor="middle" font-size="15" fill="#334155">Entrega el dinero</text>
    <text x="180" y="318" text-anchor="middle" font-size="15" fill="#334155">en la tienda</text>
    <rect x="70" y="360" width="220" height="64" rx="12" fill="#eff6ff"/>
    <text x="180" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Solo ve el abono</text>
    <text x="180" y="410" text-anchor="middle" font-size="13" fill="#1e40af">Monto · Repartidor · Nota</text>
  </g>

  <g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="340" y="120" width="280" height="340" rx="18" fill="#fff"/>
    <rect x="340" y="120" width="280" height="8" rx="4" fill="#3730a3"/>
    <circle cx="480" cy="190" r="28" fill="#e0e7ff"/>
    <text x="480" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">PIN</text>
    <text x="480" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#312e81">Repartidor</text>
    <text x="480" y="290" text-anchor="middle" font-size="15" fill="#334155">Recibe el dinero</text>
    <text x="480" y="318" text-anchor="middle" font-size="15" fill="#334155">y aprueba con PIN</text>
    <rect x="370" y="360" width="220" height="64" rx="12" fill="#eef2ff"/>
    <text x="480" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">Ingresa producto</text>
    <text x="480" y="410" text-anchor="middle" font-size="13" fill="#4338ca">Lo retira si se equivoca</text>
  </g>

  <g filter="url(#s)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="640" y="120" width="280" height="340" rx="18" fill="#fff"/>
    <rect x="640" y="120" width="280" height="8" rx="4" fill="#0f766e"/>
    <circle cx="780" cy="190" r="28" fill="#ccfbf1"/>
    <text x="780" y="198" text-anchor="middle" font-size="20" font-weight="700" fill="#0f766e">OK</text>
    <text x="780" y="250" text-anchor="middle" font-size="20" font-weight="700" fill="#115e59">MAIN</text>
    <text x="780" y="290" text-anchor="middle" font-size="15" fill="#334155">Ve todas las tiendas</text>
    <text x="780" y="318" text-anchor="middle" font-size="15" fill="#334155">y liquida</text>
    <rect x="670" y="360" width="220" height="64" rx="12" fill="#f0fdfa"/>
    <text x="780" y="388" text-anchor="middle" font-size="14" font-weight="700" fill="#0f766e">Cuentas + Liquidación</text>
    <text x="780" y="410" text-anchor="middle" font-size="13" fill="#115e59">Cierra el dinero cobrado</text>
  </g>
</svg>
