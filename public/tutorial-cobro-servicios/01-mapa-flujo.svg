  <g font-family="Segoe UI,Arial,sans-serif" fill="#94a3b8" font-size="20">
    <text x="196" y="185">→</text><text x="380" y="185">→</text><text x="564" y="185">→</text><text x="748" y="185">→</text>
  </g>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="280" width="880" height="150" rx="16" fill="#fff"/>
    <rect x="40" y="280" width="8" height="150" rx="4" fill="#0f766e"/>
    <text x="72" y="320" font-size="17" font-weight="700" fill="#0f766e">Cómo leerlo</text>
    <text x="72" y="355" font-size="15" fill="#37474f">El efectivo de servicios NO va con mercancía (Francisco). Camina solo hasta Cheche.</text>
    <text x="72" y="390" font-size="14" fill="#546e7a">Si buscas CFE en «Pendientes por liquidar», no lo vas a encontrar: mira RC Servicios.</text>
  </g>

</svg>
