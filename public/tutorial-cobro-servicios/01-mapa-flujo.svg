<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">1. Mapa · Cobro servicios → Tesorería</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Servicio se cobra · cajero aprueba · RC liquida · Cheche recibe</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <rect x="28" y="120" width="168" height="120" rx="14" fill="#fff"/>
    <circle cx="56" cy="150" r="16" fill="#0f766e"/><text x="56" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="80" y="155" font-size="14" font-weight="700" fill="#0f766e">Cobrar</text>
    <text x="48" y="195" font-size="13" fill="#546e7a">Móvil / Recolec.</text>
    <text x="48" y="218" font-size="12" fill="#94a3b8">CFE · servicios</text>

    <rect x="212" y="120" width="168" height="120" rx="14" fill="#fff"/>
    <circle cx="240" cy="150" r="16" fill="#0f766e"/><text x="240" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text>
    <text x="264" y="155" font-size="14" font-weight="700" fill="#0f766e">PIN caja</text>
    <text x="232" y="195" font-size="13" fill="#546e7a">Aprueba gasto</text>
    <text x="232" y="218" font-size="12" fill="#94a3b8">+ ingreso Fondo</text>

    <rect x="396" y="120" width="168" height="120" rx="14" fill="#fff"/>
    <circle cx="424" cy="150" r="16" fill="#0f766e"/><text x="424" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="448" y="155" font-size="14" font-weight="700" fill="#0f766e">RC Servicios</text>
    <text x="416" y="195" font-size="13" fill="#546e7a">Liquida cobros</text>
    <text x="416" y="218" font-size="12" fill="#94a3b8">por tienda</text>

    <rect x="580" y="120" width="168" height="120" rx="14" fill="#fff"/>
    <circle cx="608" cy="150" r="16" fill="#0f766e"/><text x="608" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="632" y="155" font-size="14" font-weight="700" fill="#0f766e">Servicios</text>
    <text x="600" y="195" font-size="13" fill="#546e7a">Cuenta RT</text>
    <text x="600" y="218" font-size="12" fill="#94a3b8">puente</text>

    <rect x="764" y="120" width="168" height="120" rx="14" fill="#fff"/>
    <circle cx="792" cy="150" r="16" fill="#0f766e"/><text x="792" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5</text>
    <text x="816" y="155" font-size="14" font-weight="700" fill="#0f766e">Tesorería</text>
    <text x="784" y="195" font-size="13" fill="#546e7a">Cheche</text>
    <text x="784" y="218" font-size="12" fill="#94a3b8">recibe fondos</text>
