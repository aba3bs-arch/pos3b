<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">10. Evaluación</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">8 preguntas · apruebas con 70% o más (C o mejor)</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="200" y="130" width="560" height="280" rx="20" fill="#fff"/>
    <circle cx="480" cy="230" r="70" fill="#ecfdf5" stroke="#0f766e" stroke-width="6"/>
    <text x="480" y="225" text-anchor="middle" font-size="42" font-weight="700" fill="#0f766e">B</text>
    <text x="480" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#0f766e">88%</text>
    <text x="480" y="340" text-anchor="middle" font-size="16" fill="#334155">7 / 8 correctas · ¡Aprobado!</text>
    <text x="480" y="375" text-anchor="middle" font-size="13" fill="#64748b">Si no llegas a 70%, repasa y reintenta</text>
  </g>

</svg>
