<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">7. Ledger Fondo → cuenta Servicios</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Resumen por servicio · liquidar saldo a la cuenta RT Servicios</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="420" height="320" rx="16" fill="#fff"/>
    <rect x="48" y="110" width="420" height="48" fill="#e6f4f1"/>
    <text x="68" y="140" font-size="14" font-weight="700" fill="#0f766e">Resumen por servicio</text>
    <text x="68" y="190" font-size="14" font-weight="700" fill="#0f172a">CFE / Luz</text>
    <text x="430" y="190" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e">$980.00</text>
    <text x="68" y="220" font-size="13" fill="#64748b">Ingresos $1,420 · Egresos $440</text>
    <text x="68" y="265" font-size="14" font-weight="700" fill="#0f172a">Agua</text>
    <text x="430" y="265" text-anchor="end" font-size="14" font-weight="700" fill="#0f766e">$180.00</text>
    <text x="68" y="310" font-size="13" fill="#64748b">Saldo RC Servicios</text>
    <text x="68" y="350" font-size="28" font-weight="700" fill="#0f766e">$1,160.00</text>

    <rect x="500" y="110" width="412" height="320" rx="16" fill="#fff"/>
    <rect x="500" y="110" width="412" height="48" fill="#ecfeff"/>
    <text x="520" y="140" font-size="14" font-weight="700" fill="#0f766e">Liquidar → Servicios</text>
    <text x="520" y="195" font-size="14" fill="#334155">Pasa el efectivo del ledger</text>
    <text x="520" y="225" font-size="14" fill="#334155">a la cuenta RT <tspan font-weight="700">Servicios</tspan>.</text>
    <text x="520" y="270" font-size="13" fill="#64748b">Puedes liquidar todo o un servicio.</text>
    <text x="520" y="300" font-size="13" fill="#64748b">No se mezcla con Francisco.</text>
    <rect x="520" y="340" width="360" height="48" rx="12" fill="url(#brand)"/>
    <text x="700" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Liquidar a Servicios</text>
  </g>

</svg>
