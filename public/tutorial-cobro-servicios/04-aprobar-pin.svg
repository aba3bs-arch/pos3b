<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">4. Cajero aprueba con PIN</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Notificación en caja → PIN → gasto de corte + ingreso Fondo</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="420" height="320" rx="16" fill="#fff"/>
    <rect x="48" y="110" width="420" height="48" fill="#fff7ed"/>
    <text x="68" y="140" font-size="14" font-weight="700" fill="#b45309">🔔 Notificación · cobro servicio</text>
    <text x="68" y="190" font-size="16" font-weight="700" fill="#0f172a">Cobro CFE · $350.00</text>
    <text x="68" y="225" font-size="14" fill="#334155">Luis (recolector) solicita en 3B10</text>
    <text x="68" y="255" font-size="14" fill="#334155">Corte: Abarrotes</text>
    <text x="68" y="300" font-size="13" fill="#64748b">Aprueba con tu PIN de cajero</text>
    <text x="68" y="335" font-size="13" fill="#64748b">para cargar el gasto y registrar el Fondo.</text>
    <rect x="68" y="360" width="180" height="40" rx="10" fill="url(#brand)"/>
    <text x="158" y="386" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Aprobar</text>

    <rect x="500" y="110" width="412" height="320" rx="16" fill="#fff"/>
    <rect x="500" y="110" width="412" height="48" fill="#e6f4f1"/>
    <text x="520" y="140" font-size="14" font-weight="700" fill="#0f766e">PIN de cajero</text>
    <rect x="560" y="200" width="292" height="56" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/>
    <text x="706" y="236" text-anchor="middle" font-size="28" letter-spacing="8" font-weight="700" fill="#0f766e">••••</text>
    <text x="520" y="300" font-size="14" fill="#334155">✅ Gasto en corte Abarrotes</text>
    <text x="520" y="335" font-size="14" fill="#334155">✅ Ingreso en RC Servicios / Fondo</text>
    <text x="520" y="380" font-size="13" fill="#64748b">Sin PIN → el cobro no avanza</text>
  </g>

</svg>
