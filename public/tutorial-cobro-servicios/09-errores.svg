<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">9. Errores típicos</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Evita estos tropiezos en el flujo de servicios</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="864" height="320" rx="16" fill="#fff"/>
    <g font-size="15">
      <rect x="72" y="140" width="28" height="28" rx="8" fill="#fee2e2"/><text x="86" y="160" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="116" y="160" fill="#334155">Buscar CFE en Pendientes por liquidar → mira <tspan font-weight="700" fill="#0f766e">RC Servicios</tspan></text>
      <rect x="72" y="190" width="28" height="28" rx="8" fill="#fee2e2"/><text x="86" y="210" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="116" y="210" fill="#334155">Solicitar cobro y no esperar el <tspan font-weight="700">PIN del cajero</tspan></text>
      <rect x="72" y="240" width="28" height="28" rx="8" fill="#fee2e2"/><text x="86" y="260" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="116" y="260" fill="#334155">Mezclar liquidación con mercancía (Francisco ≠ Servicios)</text>
      <rect x="72" y="290" width="28" height="28" rx="8" fill="#fee2e2"/><text x="86" y="310" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="116" y="310" fill="#334155">Enviar a Tesorería sin liquidar antes a la cuenta Servicios</text>
      <rect x="72" y="340" width="28" height="28" rx="8" fill="#fee2e2"/><text x="86" y="360" text-anchor="middle" font-size="14" fill="#b91c1c">✕</text>
      <text x="116" y="360" fill="#334155">Cobrar sin catálogo en Panel RT → Servicios</text>
      <rect x="72" y="385" width="816" height="30" rx="8" fill="#ecfdf5"/>
      <text x="90" y="405" font-size="13" font-weight="600" fill="#0f766e">✓ Servicio se cobra · cajero aprueba · RC liquida · Cheche recibe</text>
    </g>
  </g>

</svg>
