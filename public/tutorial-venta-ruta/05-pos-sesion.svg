<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">5. POS · sesión del vendedor</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Elige vendedor + PIN · el carrito queda amarrado a esa persona</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="200" y="110" width="560" height="320" rx="16" fill="#fff"/>
    <rect x="200" y="110" width="560" height="52" fill="#e6f4f1"/>
    <text x="230" y="143" font-size="15" font-weight="700" fill="#0f766e">POS venta en ruta · Entrar</text>
    <text x="230" y="200" font-size="13" font-weight="600" fill="#64748b">Vendedor / recolector</text>
    <rect x="230" y="215" width="500" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="250" y="243" font-size="14" fill="#0f172a">Luis Pérez · RT-01</text>
    <text x="230" y="295" font-size="13" font-weight="600" fill="#64748b">PIN</text>
    <rect x="230" y="310" width="500" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="250" y="338" font-size="18" letter-spacing="6" fill="#94a3b8">••••</text>
    <rect x="230" y="375" width="500" height="40" rx="10" fill="url(#brand)"/>
    <text x="480" y="401" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Entrar al POS</text>
  </g>

</svg>
