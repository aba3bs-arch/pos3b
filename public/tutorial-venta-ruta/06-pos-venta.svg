<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">6. POS · destino, catálogo y cobro</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">1 Destino → 2 Productos → 3 Carrito → 4 Cobrar</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="40" y="110" width="200" height="320" rx="14" fill="#fff"/>
    <text x="56" y="145" font-size="12" font-weight="700" fill="#0f766e">DESTINO</text>
    <rect x="56" y="165" width="168" height="36" rx="8" fill="#ecfdf5" stroke="#0f766e"/>
    <text x="68" y="188" font-size="12" font-weight="600" fill="#0f766e">3B2 Pueblo Nuevo</text>
    <text x="56" y="230" font-size="12" font-weight="700" fill="#64748b">Deptos</text>
    <rect x="56" y="245" width="168" height="28" rx="14" fill="#0f766e"/>
    <text x="140" y="264" text-anchor="middle" font-size="11" fill="#fff">ABARROTES</text>
    <rect x="56" y="285" width="168" height="28" rx="14" fill="#f1f5f9"/>
    <text x="140" y="304" text-anchor="middle" font-size="11" fill="#475569">CIGARROS</text>
    <rect x="56" y="325" width="168" height="28" rx="14" fill="#f1f5f9"/>
    <text x="140" y="344" text-anchor="middle" font-size="11" fill="#475569">BEBIDAS</text>

    <rect x="260" y="110" width="360" height="320" rx="14" fill="#fff"/>
    <text x="280" y="145" font-size="12" font-weight="700" fill="#0f766e">CATÁLOGO</text>
    <rect x="280" y="165" width="150" height="110" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="355" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">$15.50</text>
    <text x="355" y="245" text-anchor="middle" font-size="11" fill="#64748b">Galleta</text>
    <rect x="450" y="165" width="150" height="110" rx="10" fill="#f0fdfa" stroke="#5eead4"/>
    <circle cx="580" cy="180" r="12" fill="#0f766e"/>
    <text x="580" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>
    <text x="525" y="220" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">$12.00</text>
    <text x="525" y="245" text-anchor="middle" font-size="11" fill="#64748b">Agua</text>
    <text x="280" y="320" font-size="12" fill="#64748b">Toca o escanea para agregar</text>

    <rect x="640" y="110" width="280" height="320" rx="14" fill="#fff"/>
    <text x="660" y="145" font-size="12" font-weight="700" fill="#0f766e">CARRITO</text>
    <text x="660" y="185" font-size="13" fill="#334155">Galleta × 1</text>
    <text x="860" y="185" text-anchor="end" font-size="13" fill="#0f172a">$15.50</text>
    <text x="660" y="215" font-size="13" fill="#334155">Agua × 2</text>
    <text x="860" y="215" text-anchor="end" font-size="13" fill="#0f172a">$24.00</text>
    <line x1="660" y1="240" x2="900" y2="240" stroke="#e2e8f0"/>
    <text x="660" y="275" font-size="14" font-weight="700" fill="#0f766e">Total $39.50</text>
    <text x="660" y="310" font-size="11" fill="#64748b">Efe · Crédito · Mixto</text>
    <rect x="660" y="335" width="240" height="40" rx="10" fill="url(#brand)"/>
    <text x="780" y="361" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Cobrar</text>
