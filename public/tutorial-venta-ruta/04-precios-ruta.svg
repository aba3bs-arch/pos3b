<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">4. Precios de ruta</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Tarifa especial del camión (sin impuestos de piso)</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="864" height="320" rx="16" fill="#fff"/>
    <rect x="80" y="160" width="380" height="220" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="100" y="200" font-size="14" font-weight="700" fill="#64748b">Precio tienda / catálogo</text>
    <text x="100" y="260" font-size="36" font-weight="800" fill="#94a3b8">$18.00</text>
    <text x="100" y="300" font-size="13" fill="#94a3b8">Con impuestos de piso</text>
    <rect x="500" y="160" width="380" height="220" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="520" y="200" font-size="14" font-weight="700" fill="#0f766e">Precio de ruta</text>
    <text x="520" y="260" font-size="36" font-weight="800" fill="#0f766e">$15.50</text>
    <text x="520" y="300" font-size="13" fill="#0f766e">Lo usa el POS del camión</text>
    <text x="520" y="340" font-size="13" fill="#64748b">Si no hay precio ruta → catálogo</text>
  </g>

</svg>
