<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">8. Créditos por pagar · por tienda</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Ruta + Recolecciones · sync al abrir · una tienda a la vez · PIN</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="520" height="320" rx="16" fill="#fff"/>
    <rect x="48" y="110" width="520" height="48" fill="#e6f4f1"/>
    <text x="68" y="140" font-size="14" font-weight="700" fill="#0f766e">Cuentas por tienda</text>
    <rect x="68" y="180" width="480" height="64" rx="10" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="88" y="208" font-size="15" font-weight="700" fill="#0f172a">◎ 3B10 · El Mezquite</text>
    <text x="88" y="230" font-size="13" fill="#0f766e">3 créditos · $28,500.00</text>
    <rect x="68" y="260" width="480" height="56" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="88" y="285" font-size="14" font-weight="600" fill="#0f172a">○ 3B2</text>
    <text x="88" y="305" font-size="12" fill="#64748b">2 créditos · $1,140.00</text>
    <rect x="68" y="330" width="480" height="56" rx="10" fill="#fff" stroke="#e2e8f0"/>
    <text x="88" y="355" font-size="14" font-weight="600" fill="#0f172a">○ Fusión</text>
    <text x="88" y="375" font-size="12" fill="#64748b">1 crédito · $820.00</text>
    <text x="68" y="415" font-size="12" fill="#64748b">Sync silenciosa al abrir (sin botón Restaurar)</text>

    <rect x="592" y="110" width="320" height="320" rx="16" fill="#fff"/>
    <rect x="592" y="110" width="320" height="48" fill="#eff6ff"/>
    <text x="612" y="140" font-size="14" font-weight="700" fill="#1d4ed8">Cobrar una tienda</text>
    <text x="612" y="190" font-size="14" fill="#334155">1. Elige solo esa tienda</text>
    <text x="612" y="225" font-size="14" fill="#334155">2. Monto (puede ser parcial)</text>
    <text x="612" y="260" font-size="14" fill="#334155">3. PIN del cajero</text>
    <text x="612" y="295" font-size="14" fill="#334155">4. Confirmar pago</text>
    <text x="612" y="350" font-size="12" fill="#64748b">No mezclar sucursales</text>
    <text x="612" y="380" font-size="12" fill="#64748b">en el mismo cobro</text>
  </g>

</svg>
