<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">2. Camiones · asignación</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Un camión asignado a un recolector = inventario claro</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="864" height="320" rx="16" fill="#fff"/>
    <rect x="48" y="110" width="864" height="52" fill="#e6f4f1"/>
    <text x="72" y="143" font-size="15" font-weight="700" fill="#0f766e">Venta en Ruta → Camiones</text>
    <rect x="72" y="190" width="380" height="200" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="92" y="225" font-size="14" font-weight="700" fill="#0f172a">Alta / edición</text>
    <rect x="92" y="245" width="340" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="108" y="268" font-size="13" fill="#64748b">Código · RT-01</text>
    <rect x="92" y="295" width="340" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/>
    <text x="108" y="318" font-size="13" fill="#64748b">Recolector · Luis Pérez</text>
    <rect x="92" y="345" width="160" height="32" rx="8" fill="url(#brand)"/>
    <text x="172" y="366" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Guardar</text>
    <rect x="490" y="190" width="390" height="200" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="510" y="225" font-size="14" font-weight="700" fill="#0f766e">Resultado</text>
    <text x="510" y="265" font-size="14" fill="#334155">Camión RT-01</text>
    <text x="510" y="295" font-size="14" fill="#334155">Asignado a: Luis Pérez</text>
    <text x="510" y="335" font-size="13" fill="#64748b">Sin esto, carga y POS no saben</text>
    <text x="510" y="355" font-size="13" fill="#64748b">de quién es la mercancía.</text>
  </g>

</svg>
