<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">12. Errores típicos</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Incluye créditos por tienda, ingresos y servicios</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="105" width="864" height="330" rx="16" fill="#fff"/>
    <g font-size="14" font-family="Segoe UI,Arial,sans-serif">
      <rect x="72" y="130" width="24" height="24" rx="6" fill="#fee2e2"/><text x="84" y="147" text-anchor="middle" font-size="12" fill="#b91c1c">✕</text>
      <text x="110" y="148" fill="#334155">Cargar sin recolector/camión · vender sin destino</text>
      <rect x="72" y="170" width="24" height="24" rx="6" fill="#fee2e2"/><text x="84" y="187" text-anchor="middle" font-size="12" fill="#b91c1c">✕</text>
      <text x="110" y="188" fill="#334155">Mixto mal capturado (todo como efectivo)</text>
      <rect x="72" y="210" width="24" height="24" rx="6" fill="#fee2e2"/><text x="84" y="227" text-anchor="middle" font-size="12" fill="#b91c1c">✕</text>
      <text x="110" y="228" fill="#334155">Buscar CFE en Pendientes → usa <tspan font-weight="700" fill="#0f766e">RC Servicios</tspan></text>
      <rect x="72" y="250" width="24" height="24" rx="6" fill="#fee2e2"/><text x="84" y="267" text-anchor="middle" font-size="12" fill="#b91c1c">✕</text>
      <text x="110" y="268" fill="#334155">Pagar créditos de varias tiendas a la vez</text>
      <rect x="72" y="290" width="24" height="24" rx="6" fill="#fee2e2"/><text x="84" y="307" text-anchor="middle" font-size="12" fill="#b91c1c">✕</text>
      <text x="110" y="308" fill="#334155">Creer que Eliminar ingreso devuelve stock a CEDIS</text>
      <rect x="72" y="330" width="24" height="24" rx="6" fill="#fee2e2"/><text x="84" y="347" text-anchor="middle" font-size="12" fill="#b91c1c">✕</text>
      <text x="110" y="348" fill="#334155">Cancelar una carga que ya tiene ventas</text>
      <rect x="72" y="380" width="816" height="36" rx="8" fill="#ecfdf5"/>
      <text x="90" y="403" font-size="13" font-weight="600" fill="#0f766e">✓ CEDIS guarda · camión lleva · POS vende · corte cierra · servicios van solos</text>
    </g>
  </g>

</svg>
