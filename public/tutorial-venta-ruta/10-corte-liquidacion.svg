    <text x="248" y="366" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Cerrar e imprimir</text>

    <rect x="480" y="110" width="432" height="320" rx="16" fill="#fff"/>
    <rect x="480" y="110" width="432" height="48" fill="#eff6ff"/>
    <text x="500" y="140" font-size="14" font-weight="700" fill="#1d4ed8">RC/VentaRuta · pestañas</text>
    <rect x="500" y="180" width="190" height="36" rx="8" fill="#0f766e"/><text x="595" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Pendientes</text>
    <rect x="700" y="180" width="190" height="36" rx="8" fill="#f1f5f9"/><text x="795" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Historial</text>
    <rect x="500" y="230" width="190" height="36" rx="8" fill="#f1f5f9"/><text x="595" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">RC Servicios</text>
    <rect x="700" y="230" width="190" height="36" rx="8" fill="#f1f5f9"/><text x="795" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">Tesorería</text>
