  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f766e">10. Cobro servicios · RC · Tesorería</text>
