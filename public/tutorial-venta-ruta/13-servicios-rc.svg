    <text x="322" y="155" font-size="14" font-weight="700" fill="#0f766e">RC Servicios</text>
    <text x="290" y="195" font-size="13" fill="#546e7a">Liquida cobros</text>
    <text x="290" y="218" font-size="12" fill="#94a3b8">por tienda</text>

    <rect x="500" y="120" width="200" height="120" rx="14" fill="#fff"/>
    <circle cx="528" cy="150" r="16" fill="#0f766e"/><text x="528" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text>
    <text x="552" y="155" font-size="14" font-weight="700" fill="#0f766e">Servicios</text>
    <text x="520" y="195" font-size="13" fill="#546e7a">Cuenta RT</text>
    <text x="520" y="218" font-size="12" fill="#94a3b8">puente</text>

    <rect x="730" y="120" width="190" height="120" rx="14" fill="#fff"/>
    <circle cx="758" cy="150" r="16" fill="#0f766e"/><text x="758" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text>
    <text x="782" y="155" font-size="14" font-weight="700" fill="#0f766e">Tesorería</text>
    <text x="750" y="195" font-size="13" fill="#546e7a">Cheche</text>
    <text x="750" y="218" font-size="12" fill="#94a3b8">recibe</text>
