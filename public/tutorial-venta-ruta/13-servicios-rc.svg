    <text x="72" y="355" font-size="14" fill="#37474f">Pendientes por liquidar = mercancía (Francisco).</text>
    <text x="72" y="385" font-size="14" fill="#37474f">RC Servicios / Tesorería = solo CFE y pagos de servicio.</text>
