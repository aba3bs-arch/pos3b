    <circle cx="68" cy="150" r="16" fill="#0f766e"/><text x="68" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text>
    <text x="92" y="155" font-size="14" font-weight="700" fill="#0f766e">Cobrar</text>
