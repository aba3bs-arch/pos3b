<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef8f6"/>
      <stop offset="100%" stop-color="#f5f7fb"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f766e" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>

  <text x="48" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0f766e">3. Carga de camión</text>
  <text x="48" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#546e7a">Al aplicar: baja CEDIS · sube camión · ticket CI-…</text>
  <g filter="url(#shadow)" font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="110" width="420" height="320" rx="16" fill="#fff"/>
    <rect x="48" y="110" width="420" height="48" fill="#e6f4f1"/>
    <text x="68" y="140" font-size="14" font-weight="700" fill="#0f766e">Carga de camión</text>
    <text x="68" y="185" font-size="13" fill="#64748b">Camión · RT-01 · Luis</text>
    <rect x="68" y="205" width="380" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="84" y="230" font-size="13" fill="#0f172a">Galleta 100g · qty 24</text>
    <rect x="68" y="255" width="380" height="40" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="84" y="280" font-size="13" fill="#0f172a">Agua 600ml · qty 48</text>
    <rect x="68" y="320" width="380" height="44" rx="10" fill="url(#brand)"/>
    <text x="258" y="348" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Aplicar carga</text>
    <text x="68" y="395" font-size="12" fill="#64748b">Se imprime ticket y queda registro</text>

    <rect x="500" y="110" width="412" height="320" rx="16" fill="#fff"/>
    <text x="520" y="150" font-size="14" font-weight="700" fill="#0f766e">Qué ocurre al confirmar</text>
    <rect x="520" y="175" width="372" height="52" rx="10" fill="#fef2f2"/>
    <text x="540" y="207" font-size="14" font-weight="600" fill="#b91c1c">1. CEDIS − piezas</text>
    <rect x="520" y="240" width="372" height="52" rx="10" fill="#ecfdf5"/>
    <text x="540" y="272" font-size="14" font-weight="600" fill="#047857">2. Camión + mercancía</text>
    <rect x="520" y="305" width="372" height="52" rx="10" fill="#eff6ff"/>
    <text x="540" y="337" font-size="14" font-weight="600" fill="#1d4ed8">3. Ticket CI-… + Consultas</text>
    <text x="520" y="395" font-size="12" fill="#64748b">Sin ventas: Cancelar carga → vuelve a CEDIS</text>
  </g>

</svg>
